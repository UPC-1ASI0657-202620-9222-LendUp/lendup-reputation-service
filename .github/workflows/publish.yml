name: Publish release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE_NAME: fabriciofabianquispebarzola/lendup-reputation-service
  RUN_INTEGRATION: "1"
  FIREBASE_PROJECT_ID: lendup-desarrollo

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --all-groups --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy src
      - name: Unit and contract tests
        run: uv run pytest -m "not integration" -q
      - name: MySQL and RabbitMQ integration tests
        run: uv run pytest -m integration -q
      - name: Validate generated OpenAPI
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code docs/openapi.json
      - uses: docker/setup-buildx-action@v3
      - name: Build release candidate without secrets
        run: docker build --platform linux/amd64 -t "$IMAGE_NAME:${GITHUB_REF_NAME}-candidate" .
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
